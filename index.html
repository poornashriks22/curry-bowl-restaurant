<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Curry Bowl POS</title>

  <style>
    :root{
      --bg:#f6f1e8;
      --card:#fff;
      --ink:#2a211b;
      --accent:#b33a2e;
      --gold:#d28b28;
      --muted:#75695f
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font:15px Arial,sans-serif
    }

    .app{
      max-width:1250px;
      margin:auto;
      padding:20px
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:18px
    }

    .brand h1{
      margin:0;
      color:var(--accent);
      font-size:clamp(25px,4vw,40px)
    }

    .brand p{
      margin:4px 0;
      color:var(--muted)
    }

    button{
      border:0;
      border-radius:9px;
      padding:10px 14px;
      cursor:pointer;
      font-weight:700
    }

    .danger{
      background:#f3d8d4;
      color:#8f241d
    }

    .next-day{
      background:#2d7a4b;
      color:white
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1fr) 380px;
      gap:18px
    }

    .panel{
      background:var(--card);
      border-radius:16px;
      padding:18px;
      box-shadow:0 5px 20px #533b2515
    }

    .search{
      width:100%;
      padding:14px;
      border:2px solid #eadfd2;
      border-radius:10px;
      font-size:16px;
      margin-bottom:15px
    }

    .cats{
      display:flex;
      gap:8px;
      overflow:auto;
      margin-bottom:15px
    }

    .open-orders{
      display:flex;
      flex-direction:column;
      gap:8px;
      max-height:230px;
      overflow-y:auto;
      padding-right:3px;
      margin-bottom:15px
    }

    .open-order-row{
      display:flex;
      width:100%;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:11px 12px;
      border:1px solid #eadfd2;
      border-radius:10px;
      background:#fdfaf6;
      text-align:left
    }

    .open-order-row.active{
      background:var(--accent);
      color:white;
      border-color:var(--accent)
    }

    .open-order-info{
      min-width:0
    }

    .open-order-number{
      display:block;
      font-weight:bold
    }

    .open-order-name{
      display:block;
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis
    }

    .open-order-row.active .open-order-name{
      color:#ffe7e2
    }

    .open-order-total{
      font-weight:bold;
      white-space:nowrap
    }

    .new-order-list-button{
      width:100%;
      background:#f1e7db;
      color:#5b4637
    }

    .cat{
      white-space:nowrap;
      background:#f1e7db;
      color:#5b4637
    }

    .cat.active{
      background:var(--accent);
      color:white
    }

    .menu{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:12px
    }

    .item{
      border:1px solid #eee2d6;
      border-radius:12px;
      padding:13px;
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center
    }

    .item h3{
      font-size:15px;
      margin:0 0 6px
    }

    .price{
      color:var(--accent);
      font-weight:bold
    }

    .add{
      background:var(--gold);
      color:white;
      padding:8px 11px
    }

    .order h2{
      margin-top:0
    }

    .empty{
      color:var(--muted);
      padding:20px 0
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      border-bottom:1px solid #eee;
      padding:10px 0
    }

    .row small{
      display:block;
      color:var(--muted)
    }

    .qty{
      display:flex;
      align-items:center;
      gap:7px
    }

    .qty button{
      padding:4px 9px;
      background:#eee3d8
    }

    .summary{
      margin-top:15px;
      border-top:2px solid #eee2d6;
      padding-top:10px
    }

    .sumline{
      display:flex;
      justify-content:space-between;
      padding:6px 0
    }

    .total{
      font-size:21px;
      font-weight:bold;
      color:var(--accent)
    }

    .parcel{
      display:flex;
      align-items:center;
      gap:8px;
      margin:14px 0;
      padding:10px;
      background:#fff5e2;
      border-radius:9px
    }

    .customer{
      width:100%;
      padding:10px;
      border:1px solid #e2d5c8;
      border-radius:8px;
      margin:5px 0
    }

    .actions{
      display:flex;
      gap:8px;
      margin-top:12px
    }

    .primary{
      background:var(--accent);
      color:white;
      flex:1
    }

    .print{
      background:#eee3d8
    }

    .finish{
      background:#2d7a4b;
      color:white;
      width:100%;
      margin-top:10px
    }

    .order-status{
      font-size:12px;
      color:var(--muted);
      margin:0 0 10px
    }

    @media(max-width:850px){
      .layout{
        grid-template-columns:1fr
      }

      .top{
        align-items:flex-start;
        flex-direction:column
      }
    }

    @media print{
      body{
        background:white
      }

      .app>*:not(.layout),
      .menu,
      .search,
      .cats,
      .actions,
      .customer,
      .parcel,
      .open-orders{
        display:none!important
      }

      .layout{
        display:block
      }

      .panel{
        box-shadow:none
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <h1>Curry Bowl POS</h1>
        <p>Quick ordering, clear totals, fewer mistakes.</p>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="danger" onclick="newOrder()">New order</button>
        <button class="next-day" onclick="nextDay()">Next day</button>
      </div>
    </header>

    <section class="layout">
      <div class="panel">

        <div class="panel" style="padding:0;box-shadow:none;margin-bottom:15px">
          <h2 style="margin:0 0 10px">Open orders</h2>
          <div id="openOrders" class="open-orders"></div>
        </div>

        <input
          id="search"
          class="search"
          placeholder="Search dishes… e.g. rice, momo, chicken"
          oninput="renderMenu()"
        >

        <div id="cats" class="cats"></div>
        <div id="menu" class="menu"></div>
      </div>

      <aside class="panel order">
        <h2 id="orderTitle">Current order</h2>

        <p id="orderStatus" class="order-status">
          Select an open order or create a new one.
        </p>

        <input
          id="customer"
          class="customer"
          placeholder="Customer name / table number"
        >

        <div id="cart"></div>

        <label class="parcel">
          <input id="parcel" type="checkbox">
          Parcel charge
          <span>+₹10</span>
        </label>

        <div class="summary">
          <div class="sumline">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
          </div>

          <div class="sumline">
            <span>Parcel</span>
            <span id="parcelTotal">₹0</span>
          </div>

          <div class="sumline total">
            <span>Total</span>
            <span id="total">₹0</span>
          </div>
        </div>

        <div class="actions">
          <button class="primary" onclick="saveOrder()">Save order</button>
          <button class="print" onclick="window.print()">Print</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const menuData = `
Soups|Veg Clear Soup|30
Soups|Chicken Clear Soup|40
Soups|Veg Hot & Sour Soup|40
Soups|Chicken Hot & Sour Soup|50
Fried Chicken|Tenders - 6 pc (Classic)|140
Fried Chicken|Tenders - 6 pc (Peri Peri)|150
Fried Chicken|Strips - 4 pc (Classic)|100
Fried Chicken|Strips - 4 pc (Peri Peri)|120
Fried Chicken|Leg - 2 pc (Classic)|150
Fried Chicken|Leg - 2 pc (Peri Peri)|160
Fried Chicken|Wings - 4 pc (Classic)|150
Fried Chicken|Wings - 4 pc (Peri Peri)|160
Fries|Classic Fries|60
Fries|Peri Peri Fries|70
Fries|Cheesy Loaded Fries|110
Fries|Chicken Cheesy Loaded Fries|140
Fries|Lay's Chicken Loaded Fries|170
Nuggets & Popcorn|Chicken Nuggets (110 g)|69
Nuggets & Popcorn|Chicken Nuggets (200 g)|129
Nuggets & Popcorn|Chicken Popcorn (110 g)|69
Nuggets & Popcorn|Chicken Popcorn (200 g)|129
American BBQ|Wings - 2 pc|70
American BBQ|Wings - 4 pc|120
American BBQ|Wings - 6 pc|170
American BBQ|Drumstick - 1 pc|70
American BBQ|Drumstick - 2 pc|140
American BBQ|Full Leg|160
Tikkas|Arabic Tikka|140
Tikkas|Hariyali Chicken Tikka|150
Tikkas|Malai Chicken Tikka|160
Tikkas|Paneer Tikka|150
Shawarma|Classic Roll|90
Shawarma|Classic Roll / Plate|120
Shawarma|Ghost Peri Peri Roll|100
Shawarma|Ghost Peri Peri Roll / Plate|130
Shawarma|Cheesy Roll|140
Shawarma|Cheesy Roll / Plate|170
Shawarma|Loaded Beast Roll|180
Shawarma|Loaded Beast Roll / Plate|200
Wraps|Chicken Tikka Wrap|149
Wraps|Paneer Tikka Wrap|129
Burgers|Chicken Burger|119
Burgers|Veg Burger|99
Burgers|No Bun Chicken Burger (Curry Bowl Special)|250
Chinese|Classic Fried Rice - Veg|90
Chinese|Classic Fried Rice - Paneer|130
Chinese|Classic Fried Rice - Egg|110
Chinese|Classic Fried Rice - Chicken|130
Chinese|Schezwan Fried Rice - Veg|100
Chinese|Schezwan Fried Rice - Paneer|140
Chinese|Schezwan Fried Rice - Egg|120
Chinese|Schezwan Fried Rice - Chicken|140
Chinese|Classic Noodles - Veg|100
Chinese|Classic Noodles - Paneer|140
Chinese|Classic Noodles - Egg|120
Chinese|Classic Noodles - Chicken|140
Chinese|Schezwan Noodles - Veg|110
Chinese|Schezwan Noodles - Paneer|150
Chinese|Schezwan Noodles - Egg|130
Chinese|Schezwan Noodles - Chicken|150
Chinese Gravy|Veg Chinese Gravy|110
Chinese Gravy|Veg Chinese Gravy Mini|80
Chinese Gravy|Chicken Chinese Gravy|150
Chinese Gravy|Chicken Chinese Gravy Mini|100
Chinese Bowl Combo|Fried Rice + Chinese Gravy (Veg)|129
Chinese Bowl Combo|Fried Rice + Chinese Gravy (Non-Veg)|149
Chinese Bowl Combo|Noodles + Chinese Gravy (Veg)|139
Chinese Bowl Combo|Noodles + Chinese Gravy (Non-Veg)|159
Momos|Veg Momos - Steamed|70
Momos|Veg Momos - Fried|90
Momos|Veg Momos - Afghani|110
Momos|Veg Momos - Schezwan|110
Momos|Paneer Momos - Steamed|80
Momos|Paneer Momos - Fried|100
Momos|Paneer Momos - Afghani|120
Momos|Paneer Momos - Schezwan|120
Momos|Chicken Momos - Steamed|100
Momos|Chicken Momos - Fried|120
Momos|Chicken Momos - Afghani|140
Momos|Chicken Momos - Schezwan|140
Pasta|White Sauce Pasta|120
Pasta|Red Sauce Pasta|100
Coolers|Lemon Mojito|70
Coolers|Blue Curacao Mojito|80
Coolers|Strawberry Mojito|80
Coolers|Cold Milo|99
Coolers|Cold Coffee|79
Combos|CSK Curry Bowl - Veg|299
Combos|CSK Curry Bowl - Non-Veg|349
Combos|RCB - Royal Chicken Bowl|499
Combos|KKR - Kidz Riders|199
Combos|Thalapathy Kacheri|999
`.trim();

    const items = menuData.split('\n').map(row => {
      const [category, name, price] = row.split('|');
      return [category, name, Number(price)];
    });

    let orders = JSON.parse(localStorage.getItem('curryOrders') || '[]');
    let currentId = null;
    let active = 'All';

    const cats = ['All', ...new Set(items.map(item => item[0]))];

    function money(amount) {
      return '₹' + amount;
    }

    function persist() {
      localStorage.setItem('curryOrders', JSON.stringify(orders));
    }

    function current() {
      return orders.find(order => order.id === currentId);
    }

    function getOrderSubtotal(order) {
      return order.cart.reduce((sum, cartItem) => {
        return sum + items[cartItem.i][2] * cartItem.q;
      }, 0);
    }

    function getOrderTotal(order) {
      return getOrderSubtotal(order) + (order.parcel ? 10 : 0);
    }

    function renderCats() {
      document.getElementById('cats').innerHTML = cats.map(category => `
        <button
          class="cat ${category === active ? 'active' : ''}"
          onclick="active='${category}';renderCats();renderMenu()"
        >
          ${category}
        </button>
      `).join('');
    }

    function renderMenu() {
      const searchText = document.getElementById('search').value.toLowerCase();

      const list = items.filter(item =>
        (active === 'All' || item[0] === active) &&
        item[1].toLowerCase().includes(searchText)
      );

      document.getElementById('menu').innerHTML = list.map(item => `
        <div class="item">
          <div>
            <h3>${item[1]}</h3>
            <span class="price">${money(item[2])}</span>
          </div>

          <button class="add" onclick="add(${items.indexOf(item)})">Add</button>
        </div>
      `).join('') || '<p class="empty">No matching dishes.</p>';
    }

    function renderOrders() {
      const openOrders = orders.filter(order => order.status === 'open');

      document.getElementById('openOrders').innerHTML =
        openOrders.map(order => `
          <button
            class="open-order-row ${order.id === currentId ? 'active' : ''}"
            onclick="selectOrder(${order.id})"
          >
            <span class="open-order-info">
              <span class="open-order-number">Order #${order.no}</span>
              <span class="open-order-name">
                ${order.name ? order.name : 'No customer name / table number'}
              </span>
            </span>

            <span class="open-order-total">${money(getOrderTotal(order))}</span>
          </button>
        `).join('') + `
          <button class="new-order-list-button" onclick="newOrder()">
            ＋ New order
          </button>
        `;
    }

    function selectOrder(id) {
      currentId = id;
      renderOrders();
      renderCart();
    }

    function newOrder() {
      const orderNo = Math.max(0, ...orders.map(order => order.no)) + 1;
      const orderId = Date.now();

      orders.push({
        id: orderId,
        no: orderNo,
        name: '',
        cart: [],
        parcel: false,
        status: 'open'
      });

      currentId = orderId;

      persist();
      renderOrders();
      renderCart();

      document.getElementById('customer').focus();
    }

    function add(itemIndex) {
      if (!currentId) {
        newOrder();
      }

      const order = current();
      const existingItem = order.cart.find(cartItem => cartItem.i === itemIndex);

      if (existingItem) {
        existingItem.q++;
      } else {
        order.cart.push({
          i: itemIndex,
          q: 1
        });
      }

      persist();
      renderOrders();
      renderCart();
    }

    function change(itemIndex, difference) {
      const order = current();

      if (!order) {
        return;
      }

      const cartItem = order.cart.find(item => item.i === itemIndex);

      if (!cartItem) {
        return;
      }

      cartItem.q += difference;

      if (cartItem.q <= 0) {
        order.cart = order.cart.filter(item => item.i !== itemIndex);
      }

      persist();
      renderOrders();
      renderCart();
    }

    function renderCart() {
      const order = current();

      document.getElementById('orderTitle').textContent =
        order ? 'Order #' + order.no : 'Current order';

      document.getElementById('orderStatus').textContent =
        order
          ? 'Open — you can return to this order and add items later.'
          : 'Select an open order or create a new one.';

      document.getElementById('customer').value = order?.name || '';
      document.getElementById('parcel').checked = !!order?.parcel;

      const cart = order?.cart || [];
      const subtotal = order ? getOrderSubtotal(order) : 0;
      const parcelCharge = order?.parcel ? 10 : 0;

      document.getElementById('cart').innerHTML = cart.length
        ? cart.map(cartItem => `
          <div class="row">
            <div>
              <b>${items[cartItem.i][1]}</b>
              <small>${money(items[cartItem.i][2])} each</small>
            </div>

            <div class="qty">
              <button onclick="change(${cartItem.i},-1)">−</button>
              <b>${cartItem.q}</b>
              <button onclick="change(${cartItem.i},1)">+</button>
            </div>
          </div>
        `).join('')
        : '<div class="empty">Add dishes from the menu.</div>';

      document.getElementById('subtotal').textContent = money(subtotal);
      document.getElementById('parcelTotal').textContent = money(parcelCharge);
      document.getElementById('total').textContent = money(subtotal + parcelCharge);

      document.querySelector('.finish')?.remove();

      if (order) {
        const finishButton = document.createElement('button');

        finishButton.className = 'finish';
        finishButton.textContent = 'Finish and deliver order';
        finishButton.onclick = finishOrder;

        document.querySelector('.summary').appendChild(finishButton);
      }
    }

    document.getElementById('customer').addEventListener('input', event => {
      const order = current();

      if (order) {
        order.name = event.target.value;
        persist();
        renderOrders();
      }
    });

    document.getElementById('parcel').addEventListener('change', event => {
      const order = current();

      if (order) {
        order.parcel = event.target.checked;
        persist();
        renderOrders();
        renderCart();
      }
    });

    function saveOrder() {
      const order = current();

      if (!order || !order.cart.length) {
        alert('Add at least one dish.');
        return;
      }

      persist();
      renderOrders();

      alert(
        'Order #' + order.no +
        ' saved. You can reopen this order later and add more dishes.'
      );
    }

    function finishOrder() {
      const order = current();

      if (!order) {
        return;
      }

      const finalTotal = getOrderTotal(order);

      order.status = 'finished';
      persist();

      alert(
        'Order #' + order.no +
        ' finished. Total: ' +
        money(finalTotal)
      );

      currentId = null;

      renderOrders();
      renderCart();
    }

    function nextDay() {
      const hasOpenOrders = orders.some(order => order.status === 'open');

      const message = hasOpenOrders
        ? 'There are still open orders. Are you sure you want to start a new day? All current orders will be cleared and the next order will start from Order #1.'
        : 'Start a new day? All previous orders will be cleared and the next order will start from Order #1.';

      if (!confirm(message)) {
        return;
      }

      orders = [];
      currentId = null;

      localStorage.removeItem('curryOrders');

      document.getElementById('customer').value = '';
      document.getElementById('parcel').checked = false;
      document.getElementById('search').value = '';

      renderOrders();
      renderCart();
      renderMenu();

      alert('New day started successfully. Your next order will be Order #1.');
    }

    renderCats();
    renderMenu();
    renderOrders();
    renderCart();
  </script>
</body>
</html>
