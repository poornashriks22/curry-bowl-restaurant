<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curry Bowl POS</title>
<style>
:root{--bg:#f6f1e8;--card:#fff;--ink:#2a211b;--accent:#b33a2e;--gold:#d28b28;--muted:#75695f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}.app{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand h1{margin:0;color:var(--accent);font-size:clamp(25px,4vw,40px)}.brand p{margin:4px 0;color:var(--muted)}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.danger{background:#f3d8d4;color:#8f241d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px}.panel{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 5px 20px #533b2515}.search{width:100%;padding:14px;border:2px solid #eadfd2;border-radius:10px;font-size:16px;margin-bottom:15px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.cat{white-space:nowrap;background:#f1e7db;color:#5b4637}.cat.active{background:var(--accent);color:white}.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.item{border:1px solid #eee2d6;border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}.item h3{font-size:15px;margin:0 0 6px}.price{color:var(--accent);font-weight:bold}.add{background:var(--gold);color:white;padding:8px 11px}.order h2{margin-top:0}.empty{color:var(--muted);padding:20px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.row small{display:block;color:var(--muted)}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:4px 9px;background:#eee3d8}.summary{margin-top:15px;border-top:2px solid #eee2d6;padding-top:10px}.sumline{display:flex;justify-content:space-between;padding:6px 0}.total{font-size:21px;font-weight:bold;color:var(--accent)}.parcel{display:flex;align-items:center;gap:8px;margin:14px 0;padding:10px;background:#fff5e2;border-radius:9px}.customer{width:100%;padding:10px;border:1px solid #e2d5c8;border-radius:8px;margin:5px 0}.actions{display:flex;gap:8px;margin-top:12px}.primary{background:var(--accent);color:white;flex:1}.print{background:#eee3d8}.receipt{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.order{position:static}.top{align-items:flex-start;flex-direction:column}}@media print{body{background:white}.app>*:not(.layout),.menu,.search,.cats,.actions,.customer,.parcel{display:none!important}.layout{display:block}.panel{box-shadow:none}.receipt{display:block}}
</style></head><body><main class="app"><header class="top"><div class="brand"><h1>Curry Bowl POS</h1><p>Quick ordering, clear totals, fewer mistakes.</p></div><button class="danger" onclick="clearOrder()">New order</button></header><section class="layout"><div class="panel"><input id="search" class="search" placeholder="Search dishes… e.g. rice, momo, chicken" oninput="renderMenu()"><div id="cats" class="cats"></div><div id="menu" class="menu"></div></div><aside class="panel order"><h2>Current order</h2><input id="customer" class="customer" placeholder="Customer name / table number"><div id="cart"></div><label class="parcel"><input id="parcel" type="checkbox" onchange="renderCart()"> Parcel charge <span>+₹10</span></label><div class="summary"><div class="sumline"><span>Subtotal</span><span id="subtotal">₹0</span></div><div class="sumline"><span>Parcel</span><span id="parcelTotal">₹0</span></div><div class="sumline total"><span>Total</span><span id="total">₹0</span></div></div><div class="actions"><button class="primary" onclick="saveOrder()">Save order</button><button class="print" onclick="window.print()">Print</button></div></aside></section></main><script>
const items=[
['Soups','Veg Clear Soup',30],['Soups','Chicken Clear Soup',40],['Soups','Veg Hot & Sour Soup',40],['Soups','Chicken Hot & Sour Soup',50],
['Fried Chicken','Tenders - 6 pc (Classic)',140],['Fried Chicken','Tenders - 6 pc (Peri Peri)',150],['Fried Chicken','Strips - 4 pc (Classic)',100],['Fried Chicken','Strips - 4 pc (Peri Peri)',120],['Fried Chicken','Leg - 2 pc (Classic)',150],['Fried Chicken','Leg - 2 pc (Peri Peri)',160],['Fried Chicken','Wings - 4 pc (Classic)',150],['Fried Chicken','Wings - 4 pc (Peri Peri)',160],['Fried Chicken','Boneless Breast Feast - 2 pc plate (Classic)',200],['Fried Chicken','Boneless Breast Feast - 2 pc plate (Peri Peri)',210],
['Fries','Classic Fries',60],['Fries','Peri Peri Fries',70],['Fries','Cheesy Loaded Fries',110],['Fries','Chicken Cheesy Loaded Fries',140],['Fries',"Lay's Chicken Loaded Fries",170],
['Nuggets & Popcorn','Chicken Nuggets (110 g)',69],['Nuggets & Popcorn','Chicken Nuggets (200 g)',129],['Nuggets & Popcorn','Chicken Popcorn (110 g)',69],['Nuggets & Popcorn','Chicken Popcorn (200 g)',129],['Nuggets & Popcorn','Cheesy Corn Nuggets (110 g)',59],['Nuggets & Popcorn','Cheesy Corn Nuggets (200 g)',109],['Nuggets & Popcorn','Veg Nuggets (110 g)',59],['Nuggets & Popcorn','Veg Nuggets (200 g)',110],['Nuggets & Popcorn','Cheesy Pizza Mini Samosa (110 g)',79],['Nuggets & Popcorn','Cheesy Pizza Mini Samosa (200 g)',150],
['American BBQ','Wings - 2 pc',70],['American BBQ','Wings - 4 pc',120],['American BBQ','Wings - 6 pc',170],['American BBQ','Drumstick - 1 pc',70],['American BBQ','Drumstick - 2 pc',140],['American BBQ','Full Leg',160],
['Tikkas','Arabic Tikka',140],['Tikkas','Hariyali Chicken Tikka',150],['Tikkas','Malai Chicken Tikka',160],['Tikkas','Paneer Tikka',150],
['Shawarma','Classic Roll',90],['Shawarma','Classic Roll / Plate',120],['Shawarma','Ghost Peri Peri Roll',100],['Shawarma','Ghost Peri Peri Roll / Plate',130],['Shawarma','Cheesy Roll',140],['Shawarma','Cheesy Roll / Plate',170],['Shawarma','Loaded Beast Roll',180],['Shawarma','Loaded Beast Roll / Plate',200],
['Wraps','Chicken Tikka Wrap',149],['Wraps','Paneer Tikka Wrap',129],['Burgers','Chicken Burger',119],['Burgers','Veg Burger',99],['Burgers','No Bun Chicken Burger (Curry Bowl Special)',250],
['Chinese','Classic Fried Rice - Veg',90],['Chinese','Classic Fried Rice - Paneer',130],['Chinese','Classic Fried Rice - Egg',110],['Chinese','Classic Fried Rice - Chicken',130],['Chinese','Schezwan Fried Rice - Veg',100],['Chinese','Schezwan Fried Rice - Paneer',140],['Chinese','Schezwan Fried Rice - Egg',120],['Chinese','Schezwan Fried Rice - Chicken',140],['Chinese','Classic Noodles - Veg',100],['Chinese','Classic Noodles - Paneer',140],['Chinese','Classic Noodles - Egg',120],['Chinese','Classic Noodles - Chicken',140],['Chinese','Schezwan Noodles - Veg',110],['Chinese','Schezwan Noodles - Paneer',150],['Chinese','Schezwan Noodles - Egg',130],['Chinese','Schezwan Noodles - Chicken',150],
['Chinese Gravy','Veg Chinese Gravy',110],['Chinese Gravy','Veg Chinese Gravy Mini',80],['Chinese Gravy','Chicken Chinese Gravy',150],['Chinese Gravy','Chicken Chinese Gravy Mini',100],['Chinese Bowl Combo','Fried Rice + Chinese Gravy (Veg)',129],['Chinese Bowl Combo','Fried Rice + Chinese Gravy (Non-Veg)',149],['Chinese Bowl Combo','Noodles + Chinese Gravy (Veg)',139],['Chinese Bowl Combo','Noodles + Chinese Gravy (Non-Veg)',159],
['Momos','Veg Momos - Steamed',70],['Momos','Veg Momos - Fried',90],['Momos','Veg Momos - Afghani',110],['Momos','Veg Momos - Schezwan',110],['Momos','Paneer Momos - Steamed',80],['Momos','Paneer Momos - Fried',100],['Momos','Paneer Momos - Afghani',120],['Momos','Paneer Momos - Schezwan',120],['Momos','Chicken Momos - Steamed',100],['Momos','Chicken Momos - Fried',120],['Momos','Chicken Momos - Afghani',140],['Momos','Chicken Momos - Schezwan',140],
['Pasta','White Sauce Pasta',120],['Pasta','Red Sauce Pasta',100],['Coolers','Lemon Mojito',70],['Coolers','Blue Curacao Mojito',80],['Coolers','Strawberry Mojito',80],['Coolers','Cold Milo',99],['Coolers','Cold Coffee',79],
['Combos','CSK Curry Bowl - Veg',299],['Combos','CSK Curry Bowl - Non-Veg',349],['Combos','RCB - Royal Chicken Bowl',499],['Combos','KKR - Kidz Riders',199],['Combos','Thalapathy Kacheri',999]
];
let cart=[];let active='All';const cats=['All',...new Set(items.map(x=>x[0]))];function money(n){return '₹'+n}function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat ${c==active?'active':''}" onclick="active='${c}';renderCats();renderMenu()">${c}</button>`).join('')}function renderMenu(){let q=document.getElementById('search').value.toLowerCase();let list=items.filter(x=>(active==='All'||x[0]===active)&&x[1].toLowerCase().includes(q));document.getElementById('menu').innerHTML=list.map((x,i)=>`<div class="item"><div><h3>${x[1]}</h3><span class="price">${money(x[2])}</span></div><button class="add" onclick="add(${items.indexOf(x)})">Add</button></div>`).join('')||'<p class="empty">No matching dishes.</p>'}function add(i){let x=items[i],found=cart.find(y=>y.i===i);if(found)found.q++;else cart.push({i,q:1});renderCart()}function change(i,d){let x=cart.find(y=>y.i===i);if(!x)return;x.q+=d;if(x.q<=0)cart=cart.filter(y=>y.i!==i);renderCart()}function renderCart(){let sub=cart.reduce((s,y)=>s+items[y.i][2]*y.q,0);document.getElementById('cart').innerHTML=cart.length?cart.map(y=>`<div class="row"><div><b>${items[y.i][1]}</b><small>${money(items[y.i][2])} each</small></div><div class="qty"><button onclick="change(${y.i},-1)">−</button><b>${y.q}</b><button onclick="change(${y.i},1)">+</button></div></div>`).join(''):'<div class="empty">Add dishes from the menu.</div>';let p=document.getElementById('parcel').checked?10:0;document.getElementById('subtotal').textContent=money(sub);document.getElementById('parcelTotal').textContent=money(p);document.getElementById('total').textContent=money(sub+p)}function clearOrder(){cart=[];document.getElementById('parcel').checked=false;document.getElementById('customer').value='';renderCart()}function saveOrder(){if(!cart.length)return alert('Add at least one dish.');let no=localStorage.getItem('orderNo')||0;no++;localStorage.setItem('orderNo',no);alert('Order #'+no+' saved. Total: '+document.getElementById('total').textContent);clearOrder()}renderCats();renderMenu();renderCart();
</script></body></html>
